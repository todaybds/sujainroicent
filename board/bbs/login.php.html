<script>
window.addEventListener("message", function(event) {
    if (event.data && event.data.type === "setHeight") {
        var iframes = document.querySelectorAll("iframe");
        iframes.forEach(function(iframe) {
            iframe.style.height = event.data.height + "px";
        });
    }
});
</script>

            <h2 id="find_result" style="display:none">계약번호 : 19951217</h2>

<script>
jQuery(function($){
    $("#login_auto_login").click(function(){
        if (this.checked) {
            this.checked = confirm("자동로그인을 사용하시면 다음부터 회원아이디와 비밀번호를 입력하실 필요가 없습니다.\n\n공공장소에서는 개인정보가 유출될 수 있으니 사용을 자제하여 주십시오.\n\n자동로그인을 사용하시겠습니까?");
        }
    });
});

function flogin_submit(f)
{
    if( $( document.body ).triggerHandler( 'login_sumit', [f, 'flogin'] ) !== false ){
        return true;
    }
    return false;
}

function login_tap_click(){
  $('#login_tap').removeClass('join2');
  $('#login_form').show();
  $('#find_tap').addClass('join');
  $('#find_form').hide();
}

function find_tap_click(){
  $('#login_tap').addClass('join2');
  $('#login_form').hide();
  $('#find_tap').removeClass('join');
  $('#find_form').show();
}

function find_click(){

  if(!$('#find_name').val()){
    $('#find_name').focus();
    alert('이름을 입력해주세요.');
    return false;
  }

  if(!$('#find_hp').val()){
    $('#find_hp').focus();
    alert('전화번호를 입력해주세요.');
    return false;
  }

  $.ajax({
      url: g5_bbs_url+"/ajax.mb_id_find.php",
      type: "POST",
      data: {
          "reg_mb_name": $('#find_name').val(),
          "reg_mb_hp": $('#find_hp').val()
      },
      dataType: "text",
      async: false,
      cache: false,
      success: function(data) {
        console.log(data);
        if(data){
          $('#find_result').show();
          $('#find_result').text('아이디: '+data);
        }else{
          $('#find_result').show();
          $('#find_result').text('일치하는 아이디가 없습니다.');
        }
      }
  });
}

</script>
