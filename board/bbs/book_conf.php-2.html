<script>
	function del_conf(){
		$('#wr_nameR').text("");
	  $('#wr_5R').text("");
		//$('#wr_link1_hitR').text("");
		$('#wr_6R').text("");
		$('.wrap_res').hide();
	}

function book_comf() {
	del_conf();
  $('#wr_name').val($('#wr_name').val().replace(/\s/g, "").toUpperCase());
  var wr_name = $('#wr_name').val();
  wr_name = wr_name.trim();
  var wr_age = $('#wr_age').val();

  //console.log("전화번호 ",$('#wr_1').val(),$('#wr_1').val().length)

  //$("input[name=wr_1]").attr("readonly", false);
  if($('#wr_1').val() && $('#wr_1').val().length > 0 ){
    var wr_1 = $('#wr_1').val();
    wr_1 = wr_1.replace(/\-/g,'');
    $('#wr_1').val(wr_1);
  }else{
  $('#wr_1').val('');
  $('#wr_1').hide();
//  $('#wr_7_hide').show();
    var wr_1 = $('#wr_7').val() + $('#wr_8').val() + $('#wr_9').val();
  }

   //console.log("전화번호2 ",wr_1,wr_1.length)

  var wr_3 = $('#wr_3').val();
  $.ajax({
    url: g5_bbs_url + "/ajax.book_confirm.php?bo_table=book",
    type: "POST",
    data: {
      "wr_name": wr_name,
	  "wr_age":wr_age,
      "wr_1": wr_1,
      "wr_3": wr_3
    },
    dataType: "text",
    success: function (data) {
      if(data !=  'null'){
        var result = JSON.parse(data);
		//console.log(result);
        $('.wrap_res').show();
        $('#wr_nameR').text(DSdecrypt(result['wr_name']));
        $('#wr_5R').text(result['wr_5']);
        $('#wr_6R').text(result['wr_6']);
        //$('#wr_link1_hitR').text(result['wr_4']);
        var target = $("#guest_ifr", window.parent.document);
        target.css("height",'750px');  
			

			$('#wr_agetxt').text(DSdecrypt(result.wr_content));

//		console.log(DSdecrypt(result.wr_content));

      }else{

        alert("예약정보를 확인할 수 없습니다. 예약 후 이용하여 주십시오.");
      }
    },
    error:function(request,status,error){
      alert("알수없는 오류 잠시후 다시 시도해주세요.");
    }
  });
}

function book_cancel() {
  del_conf();
  $('#wr_name').val($('#wr_name').val().replace(/\s/gi, ""));
  var wr_name = $('#wr_name').val();
  wr_name = wr_name.trim();
  var wr_age = $('#wr_age').val();

  if($('#wr_1').val() && $('#wr_1').val().length > 0){
    var wr_1 = $('#wr_1').val();
    wr_1 = wr_1.replace(/\-/g,'');
    $('#wr_1').val(wr_1);
  }else{
    var wr_1 = $('#wr_7').val() + $('#wr_8').val() + $('#wr_9').val();
  }

  var wr_3 = $('#wr_3').val();

  // 본인확인 체크
  /*
  if(!$('input[name=cert_no]').val() || !$('#wr_1').val()) {
      alert("본인확인을 해주셔야 합니다.");
      $('#wr_7_hide').hide();
      $('#wr_1').show();
      $('.win_sa_cert').trigger("click");
      $("input[name=wr_name]").attr("readonly", true);
      $("input[name=wr_1]").attr("readonly", true);
      return false;
  }
  */

  var result = confirm('신청한 예약을 취소 하시겠습니까?');
  //ajax.book_cancle2.php는 예약한사람을 취소자로 변경해서 다시예약못하게하는기능
  if (result) {
    $.ajax({
      url: g5_bbs_url + "/ajax.book_cancel.php?bo_table=book",
      type: "POST",
      data: {
        "wr_name": wr_name,
       "wr_age": wr_age,
        "wr_1": wr_1,
        "wr_3": wr_3
      },
      dataType: "text",
      success: function (data) {
        //console.log(data);
        alert(data);
      },
      error:function(request,status,error){
        alert("알수없는 오류 잠시후 다시 시도해주세요.");
      }
    });
  }
}
